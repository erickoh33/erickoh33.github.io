<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Finswimming Events Game | Titan Finswimming Club</title>
<meta name="description" content="Try Apnea, Bifin and Surface: a quick finswimming mini-game by Titan Finswimming Club, Malaysia.">
<meta property="og:title" content="Finswimming Events Game | Titan Finswimming Club"><meta property="og:description" content="Dive in and race 50m in Apnea, Bifin or Surface.">
<meta property="og:image" content="https://erickoh33.github.io/titan/assets/logo/titan-avatar.png"><meta name="theme-color" content="#000000">
<link rel="icon" type="image/svg+xml" href="../assets/logo/titan-mark-crimson.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira:ital,wdth,wght@0,100..125,600..900;1,100..125,700..900&family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--red:#CE0037;--pink:#ff4d73;--off:#F1F0EF;--mute:#9aa3a8;--disp:'Saira',Impact,sans-serif;--body:'Manrope',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;color:var(--off);font-family:var(--body);-webkit-font-smoothing:antialiased}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid rgba(206,0,55,.3)}
header img{height:26px;display:block}
main{width:min(1100px,100%);margin:0 auto;padding:18px 16px 40px}
h1{font-family:var(--disp);font-weight:900;font-style:italic;text-transform:uppercase;font-size:clamp(28px,6vw,54px);line-height:.95;letter-spacing:-.01em}
h1 em{font-style:inherit;color:var(--red)}
.events{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0 12px}
.events button{font-family:var(--disp);font-weight:900;font-style:italic;text-transform:uppercase;font-size:clamp(16px,3.4vw,22px);padding:14px 6px;border-radius:14px;border:2px solid rgba(241,240,239,.2);background:#111;color:var(--off);cursor:pointer;min-height:56px}
.events button[aria-pressed=true]{background:var(--red);border-color:var(--red);color:#fff}
.card{background:var(--off);color:#111;border-radius:14px;padding:12px 16px;font-size:15px;line-height:1.5;min-height:66px}
.card b{color:var(--red)}
.stage{position:relative;margin-top:12px;border-radius:16px;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;cursor:pointer}
canvas{display:block;width:100%;height:auto}
.hint{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);background:rgba(0,0,0,.7);padding:9px 16px;border-radius:999px;font-weight:800;font-size:14px;white-space:nowrap;pointer-events:none}
.result{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.72);padding:16px}
.result.on{display:flex}
.result .box{background:var(--off);color:#111;border-radius:18px;padding:20px;text-align:center;max-width:420px;width:100%}
.result h2{font-family:var(--disp);font-weight:900;font-style:italic;text-transform:uppercase;font-size:20px}
.result .t{font-family:var(--disp);font-weight:900;font-style:italic;font-size:52px;color:var(--red);line-height:1.1}
.result p{font-size:14px;margin:6px 0 14px}
.btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 18px;border-radius:999px;font:800 14px var(--body);border:0;cursor:pointer;text-decoration:none;background:var(--red);color:#fff}
.btn.alt{background:#111;color:#fff}
.foot{margin-top:16px;color:var(--mute);font-size:13px}
</style></head>
<body>
<header><a href="../" aria-label="Titan Finswimming Club home"><img src="../assets/logo/titan-comb-dark.svg" alt="Titan"></a></header>
<main>

<div class="events" role="group" aria-label="Event"><button data-ev="apnea" aria-pressed="true">Apnea</button><button data-ev="bifin" aria-pressed="false">Bifin</button><button data-ev="surface" aria-pressed="false">Surface</button></div>

<div class="btns"><button class="btn alt" id="again"></button><a class="btn" id="trial" href="https://wa.me/60122864815?text=Hi%20Titan!%20I%27d%20like%20to%20book%20a%20free%20trial." target="_blank" rel="noopener"></a></div></div></div></div>
<p class="foot" id="foot"></p>
</main>
<script>
const T={en:{ttl:'Finswimming <em>events</em> game',dive:'Tap to dive!',kick:'Tap or hold to kick faster',fin:'Finish!',again:'Try another event',trial:'Book a free trial',foot:'A Titan Finswimming Club mini-game. 50m pool, 15m underwater limit for Bifin and Surface (our swimmers surface at 14m to stay safe).',breath:'BREATH-HOLD',under:'UNDERWATER',surf:'SURFACE SWIM',
 rText:'Great swim! Want to learn it for real?',
 apnea:'<b>Apnea:</b> one monofin and no snorkel. The finswimmer holds their breath and stays fully underwater all the way to the wall.',
 bifin:'<b>Bifin:</b> two bifins and a centre snorkel. Dive and swim underwater, breaking the surface around 14m (before the 15m limit), then swim freestyle arms with a bifin kick.',
 surface:'<b>Surface:</b> monofin and a centre snorkel. Dive and swim underwater, breaking the surface around 14m (before the 15m limit), then swim face-down on the surface, arms in streamline, dolphin kicking.'}};
const $=id=>document.getElementById(id),cv=$('c'),ctx=cv.getContext('2d');
const lang='en';
let ev='apnea',W,H,s,surfY,dpr,viewM;
const G={};function reset(){Object.assign(G,{state:'ready',x:0.3,y:-1.2,ang:-0.15,blend:0,splashed:0,touch:0,v:0,t:0,p:0,arm:0,boost:0,hold:false,breath:1,bub:[],splash:[],finT:0});$('result').classList.remove('on');ui()}
function ui(){const L=T[lang];$('ttl').innerHTML=L.ttl;$('card').innerHTML=L[ev];$('again').textContent=L.again;$('trial').textContent=L.trial;$('foot').textContent=L.foot;
 $('hint').textContent=G.state==='ready'?L.dive:L.kick;$('hint').style.display=G.state==='done'?'none':'';document.querySelectorAll('.events button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.ev===ev))}
function size(){const r=cv.parentElement.getBoundingClientRect();dpr=Math.min(2,devicePixelRatio||1);W=r.width;H=Math.round(Math.max(260,Math.min(W*0.55,innerHeight*0.55)));
 cv.width=W*dpr;cv.height=H*dpr;cv.style.height=H+'px';viewM=W<600?8:13;s=Math.min(W/viewM,H/3.9);viewM=W/s;surfY=Math.max(H*0.36,1.65*s+56)}
addEventListener('resize',size);
document.querySelectorAll('.events button').forEach(b=>b.onclick=()=>{ev=b.dataset.ev;reset()});
$('again').onclick=e=>{e.stopPropagation();ev={apnea:'bifin',bifin:'surface',surface:'apnea'}[ev];reset()};
const st=$('stage');
st.addEventListener('pointerdown',e=>{if(e.target.closest('.result'))return;if(G.state==='ready'){G.state='dive';G.dt=0;ui()}else if(G.state!=='done'){G.boost=Math.min(1.6,G.boost+0.55)}G.hold=true});
addEventListener('pointerup',()=>G.hold=false);addEventListener('pointercancel',()=>G.hold=false);
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();if(!e.repeat)st.dispatchEvent(new PointerEvent('pointerdown'));G.hold=true}});addEventListener('keyup',e=>{if(e.code==='Space')G.hold=false});
const UW=ev=>ev==='apnea'?50:14, DEPTH=1.05, SURF=0.22;
function step(dt){const g=G;if(g.state==='ready'){g.p+=dt*1.5;return}
 if(g.state!=='done')g.t+=dt;
 if(g.state==='dive'){g.dt+=dt;const BL=0.28,FL=0.62;
  if(g.dt<BL){g.blend=g.dt/BL;g.x=0.3;g.y=-1.2;g.ang=-0.15;return}
  g.blend=1;const u=Math.min(1,(g.dt-BL)/FL);g.x=0.3+3*u;g.y=-1.2+1.95*u*u-0.45*u*(1-u);
  g.ang=Math.atan2(3.9*u-0.45+0.9*u,3);
  if(u>0.62&&!g.splashed){g.splashed=1;for(let i=0;i<24;i++)g.splash.push({x:g.x+1.2+Math.random()*0.6,y:0,vx:(Math.random()-.3)*2,vy:-2-Math.random()*3,l:1})}
  if(u>=1){g.state='under';g.v=3.4}return}
 const tgt=(g.state==='swim'?(ev==='bifin'?1.75:2.0):(ev==='apnea'?2.05:2.15))+(g.hold?0.9:0)+g.boost*0.6;
 if(g.state==='done'){g.v=0;g.p+=dt*0.6}else{g.boost=Math.max(0,g.boost-dt*1.2);g.v+=(tgt-g.v)*Math.min(1,dt*1.6);g.x+=g.v*dt;g.p+=dt*(3.2+g.v*2.4);g.arm+=dt*(2.2+g.v*0.9);}
 const head=g.x+0.95;
 if(g.state==='under'){const lim=UW(ev);let ty=DEPTH;if(ev==='apnea'&&head>46)ty=SURF+(DEPTH-SURF)*Math.max(0,(48-head)/2);if(ev!=='apnea'){const d=lim-head;if(d<4)ty=SURF+(DEPTH-SURF)*Math.max(0,d/4)}
  const vy=(ty-g.y)*Math.min(1,dt*2.5);g.y+=vy;g.ang+=(Math.atan2(vy/dt||0,g.v)*0.8-g.ang)*Math.min(1,dt*4);
  if(ev==='apnea')g.breath=Math.max(0.08,1-g.t/40);
  if(ev!=='apnea'&&head>=lim){g.state='swim';g.y=SURF;for(let i=0;i<12;i++)g.splash.push({x:head-0.2,y:0,vx:Math.random()*1.5,vy:-1-Math.random()*1.5,l:1})}}
 if(g.state==='swim'){g.y+=(SURF-g.y)*dt*3;g.ang*=1-dt*4}
 if(Math.random()<dt*(g.state==='swim'?14:9)){const fx=g.x-1.25;g.bub.push({x:fx+Math.random()*0.3,y:g.y+(Math.random()-.5)*0.3,r:0.02+Math.random()*0.05,l:1})}
 if(ev==='apnea'&&g.state==='under'&&Math.random()<dt*1.2)g.bub.push({x:head,y:g.y,r:0.03,l:1});
 if(g.state==='swim'&&Math.random()<dt*10)g.splash.push({x:g.x-1.1,y:0,vx:-.5,vy:-1-Math.random(),l:.7});
 if(g.x+1.52>=50&&g.state!=='done'){g.state='done';g.x=50-1.52;g.v=0;g.touch=1;g.y=Math.min(g.y,SURF);g.finT=g.t;setTimeout(()=>{$('rTitle').textContent=T[lang].fin+' · '+ev.charAt(0).toUpperCase()+ev.slice(1)+' 50m';$('rTime').textContent=fmt(g.finT);$('rText').textContent=T[lang].rText;$('result').classList.add('on');ui()},500)}
 g.bub.forEach(b=>{b.y-=dt*0.6;b.x+=Math.sin(b.y*8)*dt*0.1;b.l-=dt*0.5;if(b.y<0)b.l=0});g.bub=g.bub.filter(b=>b.l>0);
 g.splash.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=9*dt;p.l-=dt*1.4});g.splash=g.splash.filter(p=>p.l>0&&p.y<0.05)}
function fmt(t){const m=Math.floor(t/60),sec=(t%60).toFixed(2).padStart(5,'0');return (m?m+':':'')+sec}
function draw(){const g=G;ctx.setTransform(dpr,0,0,dpr,0,0);
 const cam=Math.max(-2.2,Math.min(50.6-viewM,g.x-viewM*0.35)),X=m=>(m-cam)*s,Y=m=>surfY+m*s;
 let sky=ctx.createLinearGradient(0,0,0,surfY);sky.addColorStop(0,'#0a0a0a');sky.addColorStop(1,'#1a1a1a');ctx.fillStyle=sky;ctx.fillRect(0,0,W,surfY);
 let wat=ctx.createLinearGradient(0,surfY,0,H);wat.addColorStop(0,'#0b6e8f');wat.addColorStop(1,'#03253a');ctx.fillStyle=wat;ctx.fillRect(0,surfY,W,H-surfY);
 // floor + lane line
 ctx.fillStyle='#0f3b52';ctx.fillRect(0,Y(2.05),W,H);ctx.fillStyle='#00000055';ctx.fillRect(0,Y(1.85),W,s*0.08);
 // light rays
 ctx.save();ctx.globalAlpha=.07;ctx.fillStyle='#fff';for(let i=-2;i<12;i++){const bx=X(Math.floor(cam/4)*4+i*4)-((performance.now()/80)%40);ctx.beginPath();ctx.moveTo(bx,surfY);ctx.lineTo(bx+s*0.8,surfY);ctx.lineTo(bx+s*2.4,H);ctx.lineTo(bx+s*1.4,H);ctx.fill()}ctx.restore();
 // distance marks
 ctx.textAlign='center';for(let m=0;m<=50;m+=5){const x=X(m);if(x<-40||x>W+40)continue;ctx.strokeStyle=m===15?'#CE0037':'#ffffff30';ctx.lineWidth=m===15?3:1;ctx.setLineDash(m===15?[]:[4,6]);ctx.beginPath();ctx.moveTo(x,surfY-s*0.25);ctx.lineTo(x,Y(1.85));ctx.stroke();ctx.setLineDash([]);
  ctx.fillStyle=m===15?'#CE0037':'#ffffffaa';ctx.font=`800 ${m===15?15:12}px Manrope`;ctx.fillText(m+'m',x,surfY-s*0.32)}
 const x15=X(15);if(x15>-50&&x15<W+50){ctx.fillStyle='#CE0037';ctx.beginPath();ctx.moveTo(x15,surfY-s*0.25);ctx.lineTo(x15+16,surfY-s*0.25+7);ctx.lineTo(x15,surfY-s*0.25+14);ctx.fill();ctx.font='800 10px Manrope';ctx.fillText('15m LIMIT',x15,Y(1.98))}
 // lane rope floats
 for(let m=Math.floor(cam*2)/2;m<cam+viewM+1;m+=0.5){ctx.fillStyle=(Math.round(m*2)%10<2)?'#CE0037':'#F1F0EF';ctx.globalAlpha=.55;ctx.beginPath();ctx.ellipse(X(m),surfY-s*0.12,s*0.07,s*0.045,0,0,7);ctx.fill();ctx.globalAlpha=1}
 // walls & block
 ctx.fillStyle='#d9d9d9';ctx.fillRect(X(-3),surfY-s*0.25,X(0)-X(-3),H);ctx.fillStyle='#bbb';ctx.fillRect(X(50),surfY-s*0.25,s*3,H);
 ctx.fillStyle='#CE0037';ctx.fillRect(X(-0.7),surfY-s*0.85,s*0.75,s*0.6);ctx.fillStyle='#000';ctx.font=`900 italic ${Math.round(s*0.22)}px Saira`;ctx.fillText('T',X(-0.32),surfY-s*0.43);
 ctx.fillStyle='#CE0037';ctx.fillRect(X(50)-3,surfY,6,s*1.4);
 // surface wave
 ctx.strokeStyle='#bfefff99';ctx.lineWidth=2;ctx.beginPath();for(let x=0;x<=W;x+=8){const yy=surfY+Math.sin(x*0.04+performance.now()/400)*2;x?ctx.lineTo(x,yy):ctx.moveTo(x,yy)}ctx.stroke();
 // bubbles
 ctx.strokeStyle='#ffffffaa';ctx.lineWidth=1.2;g.bub.forEach(b=>{ctx.globalAlpha=b.l;ctx.beginPath();ctx.arc(X(b.x),Y(b.y),b.r*s,0,7);ctx.stroke()});ctx.globalAlpha=1;
 (g.state==='ready'||(g.state==='dive'&&g.blend<1))?startPose(cam):swimmer(X(g.x),Y(g.y));
 ctx.fillStyle='#ffffffdd';g.splash.forEach(p=>{ctx.globalAlpha=Math.max(0,p.l);ctx.beginPath();ctx.arc(X(p.x),Y(p.y),2.5,0,7);ctx.fill()});ctx.globalAlpha=1;
 hud(cam)}
const lerp=(a,b,t)=>({x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t});
function startPose(cam){const g=G,t=g.state==='ready'?0:(1-Math.cos(Math.PI*g.blend))/2;
 /* READY pose in world metres: block top y=-0.85, front edge x=0.05. Crouched grab start. */
 const R={toe:{x:0.04,y:-0.86},an:{x:-0.12,y:-0.9},kn:{x:0.08,y:-1.22},hip:{x:-0.32,y:-1.3},sh:{x:0.22,y:-1.2},hd:{x:0.36,y:-1.02},hand:{x:0.06,y:-0.87},tip:{x:0.5,y:-0.42}};
 const c=Math.cos(-0.15),sn=Math.sin(-0.15),W2=p=>({x:0.3+p.x*c-p.y*sn,y:-1.2+p.x*sn+p.y*c});
 const S={toe:W2({x:-0.98,y:0}),an:W2({x:-0.92,y:0}),kn:W2({x:-0.46,y:0}),hip:W2({x:0,y:0}),sh:W2({x:0.62,y:0}),hd:W2({x:0.9,y:-0.02}),hand:W2({x:1.5,y:-0.02}),tip:W2({x:-1.55,y:0})};
 const J={};for(const k in R)J[k]=lerp(R[k],S[k],t);
 if(t>0&&t<1)J.hand.y-=Math.sin(Math.PI*t)*0.55;
 const skin='#e0ac83',suit='#CE0037';
 ctx.save();ctx.translate(-cam*s,surfY);ctx.scale(s,s);ctx.lineCap='round';ctx.lineJoin='round';
 const seg=(a,b,w,col)=>{ctx.strokeStyle=col;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()};
 const fin=(off,col)=>{const a={x:J.an.x+off,y:J.an.y},tp={x:J.tip.x+off,y:J.tip.y},d={x:tp.x-a.x,y:tp.y-a.y},L=Math.hypot(d.x,d.y)||1,n={x:-d.y/L,y:d.x/L},wd=ev==='bifin'?0.05:0.08,f=ev==='bifin'?1.2:2.8;
  ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(a.x+n.x*wd,a.y+n.y*wd);ctx.lineTo(tp.x+n.x*wd*f,tp.y+n.y*wd*f);ctx.lineTo(tp.x-n.x*wd*f*.6,tp.y-n.y*wd*f*.6);ctx.lineTo(a.x-n.x*wd,a.y-n.y*wd);ctx.closePath();ctx.fill()};
 if(ev==='bifin'){fin(-0.04,'#000');seg({x:J.hip.x-0.03,y:J.hip.y},{x:J.kn.x-0.04,y:J.kn.y},0.15,'#b98a68');seg({x:J.kn.x-0.04,y:J.kn.y},{x:J.an.x-0.04,y:J.an.y},0.11,'#b98a68')}
 fin(0,ev==='bifin'?'#1a1a1a':'#111');if(ev!=='bifin')seg(J.an,J.tip,0.025,'#CE0037');
 seg(J.hip,J.kn,0.15,skin);seg(J.kn,J.an,0.11,skin);seg(J.an,J.toe,0.08,skin);
 seg(J.hip,J.sh,0.3,suit);
 const el=lerp(J.sh,J.hand,0.5);seg(J.sh,el,0.09,skin);seg(el,J.hand,0.08,skin);
 const dir=Math.atan2(J.hd.y-J.sh.y,J.hd.x-J.sh.x);ctx.save();ctx.translate(J.hd.x,J.hd.y);ctx.rotate(dir);
 ctx.fillStyle=skin;ctx.beginPath();ctx.ellipse(0,0,0.13,0.11,0,0,7);ctx.fill();ctx.fillStyle='#000';ctx.beginPath();ctx.ellipse(-0.02,-0.03,0.13,0.09,0,Math.PI,0);ctx.fill();
 ctx.fillStyle='#111';ctx.fillRect(0.05,0.03,0.09,0.06);ctx.fillStyle='#7fd4ff';ctx.fillRect(0.085,0.04,0.05,0.04);
 if(ev!=='apnea'){ctx.strokeStyle='#ffcc00';ctx.lineWidth=0.045;ctx.beginPath();ctx.moveTo(0.1,0.1);ctx.quadraticCurveTo(0.2,0.02,0.12,-0.14);ctx.lineTo(0.08,-0.25);ctx.stroke();ctx.fillStyle="#CE0037";ctx.fillRect(0.05,-0.28,0.06,0.04)}
 ctx.restore();ctx.restore()}
function swimmer(px,py){const g=G,dolph=ev!=='bifin',onBlock=g.state==='ready',surf=g.state==='swim';
 ctx.save();ctx.translate(px,py);ctx.rotate(onBlock?0:g.ang);ctx.scale(s,s);ctx.lineCap='round';ctx.lineJoin='round';
 const p=g.p,w=onBlock?0:1;
 if(onBlock){ // crouched start pose, facing right
  ctx.rotate(-0.25)}

 const skin='#e0ac83',suit='#CE0037';
 function seg(a,b,wd,c){ctx.strokeStyle=c;ctx.lineWidth=wd;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}
 function leg(ph,col){const hip={x:0,y:0},kn={x:-0.46,y:Math.sin(ph)*0.12*w},an={x:-0.92,y:Math.sin(ph-0.7)*0.2*w};seg(hip,kn,0.15,col);seg(kn,an,0.11,col);return {kn,an}}
 /* Fin follows the shin line (pointed foot), blade flexes opposite to the kick with lag (water pressure). */
 function finBlade(L,ph,wide,col){const {kn,an}=L,dx=an.x-kn.x,dy=an.y-kn.y,d=Math.hypot(dx,dy)||1,ux=dx/d,uy=dy/d,nx=-uy,ny=ux;

  const tip={x:foot.x+ux*len,y:foot.y+uy*len+flex},cp={x:foot.x+ux*len*0.5,y:foot.y+uy*len*0.5+flex*0.15};
